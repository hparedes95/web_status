name: Estado de servicios

on:
  schedule:
    # Cada 10 minutos. Actions no es puntual: con carga puede retrasarse bastante,
    # así que la cadencia real es de 10-20 min. Los minutos son gratis porque el
    # repositorio es público. Si algún día pasa a privado, dejan de serlo: cada
    # ejecución ronda los 2 min facturados, así que habría que subir el intervalo
    # a 30 min o a 1 hora (ver docs/04-arranque.md).
    - cron: "*/10 * * * *"
  # Al abrir, cerrar o etiquetar una issue `caida:*` el panel se actualiza al momento
  # en vez de esperar al siguiente ciclo.
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write   # commit de estado.json
  issues: read      # leer las incidencias marcadas a mano
  pages: write      # publicar el panel
  id-token: write   # requerido por deploy-pages

# Que dos ciclos no se pisen al escribir estado.json ni al desplegar.
concurrency:
  group: estado-servicios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: el paso de guardado puede necesitar rebasar sobre
          # lo que haya empujado otro ciclo, y eso no es fiable en un clon somero.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer el estado de los proveedores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
        run: python src/poller.py

      # estado.json guarda también el historial por horas que dibuja la barra del
      # panel, así que cambia al menos una vez por hora: ~24 commits al día. Eso
      # mantiene vivo el repositorio, que es lo que evita que GitHub desactive el
      # workflow programado por inactividad.
      - name: Guardar el estado si ha cambiado
        run: |
          if [ -z "$(git status --porcelain estado.json)" ]; then
            echo "Sin cambios de estado."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git commit -m "Estado: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Normalmente basta con empujar: el `concurrency` de arriba serializa los
          # ciclos. Solo si aun así hubiera carrera, se rebasa y se reintenta.
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

      # Activar Pages desde aquí no es posible: el token del workflow no tiene
      # permiso para crear el sitio (`Resource not accessible by integration`).
      # Hay que activarlo una vez a mano, y este paso lo dice claro si falta.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true

      - name: Comprobar que GitHub Pages está activado
        if: steps.pages.outcome != 'success'
        run: |
          echo "::error title=Falta activar GitHub Pages::Ajustes del repositorio > Pages > Source: GitHub Actions. El estado se ha leído y guardado igualmente; lo único que falta es publicar la página."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: desplegar
        uses: actions/deploy-pages@v4
