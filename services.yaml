# Los diez indicadores del panel. Añadir uno nuevo con página de estado pública
# es añadir un bloque aquí, no desarrollar.
#
# tipos de fuente:
#   statuspage  JSON estándar en /api/v2/summary.json
#   rss         feed RSS o Atom
#   json        JSON con formato propio del proveedor
#   graph       Microsoft Graph (solo si se elige la opción B de docs/02-fuentes.md)
#   manual      alguien lo marca a mano; se guarda quién y cuándo
#
# alerta: true -> se avisa por Telegram al pasar a rojo. Regla en docs/03-implementacion.md
#
# Los servicios `manual` se encienden abriendo una issue con la etiqueta
# caida:<id> y se apagan al cerrarla.

servicios:

  # ───────── Microsoft ─────────

  - id: microsoft-365
    nombre: "Microsoft 365"
    detalle: "Correo, Teams, SharePoint, Copilot"
    alerta: true
    fuente:
      tipo: rss                      # opción A: público, sin credenciales
      url: "https://status.cloud.microsoft/api/feed"
      # opción B, si A no sirve: requiere app en Entra ID con ServiceHealth.Read.All
      # tipo: graph
      # servicios: ["Exchange Online", "Microsoft Teams", "SharePoint Online",
      #             "Identity Service", "Microsoft 365 Copilot"]

  - id: azure
    nombre: "Azure"
    alerta: true
    fuente:
      tipo: rss
      url: "https://azure.status.microsoft/en-us/status/feed/"
      regiones: ["West Europe", "North Europe"]   # sin filtro, una caída en Brasil nos pinta rojo

  # ───────── AWS ─────────

  - id: aws
    nombre: "AWS"
    alerta: true
    fuente:
      tipo: json
      url: "https://health.aws.amazon.com/public/currentevents"
      regiones: ["eu-west-1", "eu-south-2"]

  # ───────── IA ─────────

  - id: claude
    nombre: "Claude"
    alerta: false
    fuente:
      tipo: statuspage
      url: "https://status.anthropic.com"

  - id: chatgpt
    nombre: "ChatGPT"
    alerta: false
    fuente:
      tipo: statuspage
      url: "https://status.openai.com"

  - id: github
    nombre: "GitHub"
    detalle: "Repositorios, Actions, pull requests"
    alerta: false
    fuente:
      tipo: statuspage
      url: "https://www.githubstatus.com"
      componentes: ["Git Operations", "API Requests", "Actions", "Pull Requests"]

  - id: copilot
    nombre: "GitHub Copilot"
    alerta: false
    fuente:
      tipo: statuspage
      url: "https://www.githubstatus.com"     # misma peticion que el bloque anterior
      componentes: ["Copilot"]                # separados: una averia de Copilot no apaga GitHub

  # ───────── Sin API: botón manual ─────────
  # Nadie publica esto en formato consultable. Si nadie pulsa el botón,
  # estas tres luces se quedan en verde durante la avería.

  - id: telefonica
    nombre: "Telefónica / Movistar"
    detalle: "Movistar es la marca comercial de Telefónica: un indicador, no dos"
    alerta: false
    fuente:
      tipo: manual

  - id: vodafone
    nombre: "Vodafone"
    alerta: false
    fuente:
      tipo: manual

  - id: energia
    nombre: "Suministro eléctrico"
    alerta: false
    fuente:
      tipo: manual

# ───────── Alerta ─────────
alerta:
  canal: telegram
  # Las credenciales van en los secretos del repositorio, NUNCA aquí:
  # Ajustes > Secrets and variables > Actions
  #   TELEGRAM_BOT_TOKEN  el que da @BotFather al crear el bot
  #   TELEGRAM_CHAT_ID    el chat o grupo donde escribe el bot
  lecturas_para_avisar: 2      # antirrebote: ~20 min en rojo antes de avisar
  avisar_recuperacion: true    # "Azure operativo tras 34 min"
  # Solo se avisa al pasar a `caido`. Degradado, mantenimiento y fuentes
  # ilegibles se ven en el panel pero no mandan mensaje.
